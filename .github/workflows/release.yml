name: Release

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  # Build Python CLI with Nuitka for each platform
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_name: linux
            binary_name: 8085-simulator-linux
          - platform: windows-latest
            os_name: windows
            binary_name: 8085-simulator.exe
          - platform: macos-13
            os_name: macos-x64
            binary_name: 8085-simulator-macos-x64
          - platform: macos-14
            os_name: macos-arm64
            binary_name: 8085-simulator-macos-arm64

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install patchelf (Linux only)
        if: matrix.os_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CLI with Nuitka (Unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          chmod +x Scripts/build.sh
          bash Scripts/build.sh

      - name: Build CLI with Nuitka (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          .\Scripts\build.ps1

      - name: Prepare CLI artifact
        shell: bash
        run: |
          mkdir -p cli-artifact
          cp release/${{ matrix.binary_name }} cli-artifact/${{ matrix.binary_name }}
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            chmod +x cli-artifact/${{ matrix.binary_name }}
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os_name }}
          path: cli-artifact/
          retention-days: 5

  # Create GitHub Release with all CLI binaries
  create-release:
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: cli-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          chmod +x Scripts/prepare_release.sh
          bash Scripts/prepare_release.sh artifacts release-files

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 8085 Microprocessor Simulator ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            ## 8085 Microprocessor Simulator CLI
            
            Standalone command-line interface for the 8085 Microprocessor Simulator.
            
            ### Installation
            
            1. Download the binary for your platform
            2. Make it executable (Linux/macOS): `chmod +x 8085-simulator-*`
            3. Run it: `./8085-simulator-*` (Linux/macOS) or `8085-simulator.exe` (Windows)
            
            ### Usage
            
            Run the binary and type `help` to see available commands.
            
            ### Binaries
            
            - **Linux**: `8085-simulator-linux`
            - **Windows**: `8085-simulator.exe`
            - **macOS Intel**: `8085-simulator-macos-x64`
            - **macOS Apple Silicon**: `8085-simulator-macos-arm64`
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
