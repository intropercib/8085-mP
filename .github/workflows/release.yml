name: Release

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  # Build Python CLI with Nuitka for each platform
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
              - platform: ubuntu-22.04
                os_name: linux
                binary_name: 8085-simulator-linux
              - platform: windows-latest
                os_name: windows
                binary_name: 8085-simulator.exe

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install patchelf (Linux only)
        if: matrix.os_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # Ensure Nuitka is available for the build (not always present in requirements)
          python -m pip install --upgrade nuitka

      - name: Build CLI with Nuitka (Unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          chmod +x Scripts/build.sh
          bash Scripts/build.sh

      - name: Build CLI with Nuitka (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          .\Scripts\build.ps1

      - name: Prepare CLI artifact (Unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          mkdir -p cli-artifact
          # Find the first executable in release/ and copy it, normalizing the name
          SRC=$(find release -maxdepth 1 -type f -executable -printf "%f\n" 2>/dev/null | head -n1 || true)
          if [ -z "$SRC" ]; then
            echo "No built binary found in release/"
            ls -la release || true
            exit 1
          fi
          cp "release/$SRC" "cli-artifact/${{ matrix.binary_name }}"
          chmod +x "cli-artifact/${{ matrix.binary_name }}"

      - name: Prepare CLI artifact (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cli-artifact | Out-Null
          $src = Get-ChildItem -Path release -File | Where-Object { $_.Name -like '8085-simulator*' } | Select-Object -First 1
          if (-not $src) {
            Write-Error 'No built binary found in release/'
            Get-ChildItem release -Recurse
            exit 1
          }
          Copy-Item $src.FullName -Destination "cli-artifact\${{ matrix.binary_name }}" -Force

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os_name }}
          path: cli-artifact/
          retention-days: 5

  # Create GitHub Release with all CLI binaries
  create-release:
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: cli-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          chmod +x Scripts/prepare_release.sh
          bash Scripts/prepare_release.sh artifacts release-files

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 8085 Microprocessor Simulator ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            ## 8085 Microprocessor Simulator CLI
            
            Standalone command-line interface for the 8085 Microprocessor Simulator.
            
            ### Installation
            
            1. Download the binary for your platform
            2. Make it executable (Linux/macOS): `chmod +x 8085-simulator-*`
            3. Run it: `./8085-simulator-*` (Linux/macOS) or `8085-simulator.exe` (Windows)
            
            ### Usage
            
            Run the binary and type `help` to see available commands.
            
            ### Binaries

            - **Linux**: `8085-simulator-linux`
            - **Windows**: `8085-simulator.exe`
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
